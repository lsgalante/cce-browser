[package]
name = "cce-browser"
version = "0.1.0"
edition = "2021"
# Only runs bindgen when the `wpe` feature is on, so a default build needs
# no WPE headers and stays exactly as it was.
build = "build.rs"

[features]
# WPE WebKit is the engine as of 2026-08-30 (see WPE-PORT.md). Default, so a
# plain `cargo build` — including another session's sweep or reinstall —
# ships the right engine instead of silently reverting to Servo, which is
# exactly what happened two days after the port landed. Needs
# `pacman -S wpewebkit`.
default = ["wpe"]
wpe = ["dep:rustix"]
# The retired Servo backend, kept buildable for comparison:
#   cargo build --release -p cce-browser --no-default-features --features servo
servo = ["dep:servo", "dep:dpi", "dep:euclid", "dep:rustls", "dep:reqwest", "dep:http"]

[dependencies]
cce-ui = { git = "https://github.com/lsgalante/cce-ui.git", rev = "0ba585e909f0f59cda65dd309b0f45ce6d8e1695" }
calloop = "0.13.0"
wayland-client = { version = "0.31", features = ["system"] }
servo = { version = "0.4", optional = true }
url = "2"
http = { version = "1", optional = true }
reqwest = { version = "0.12", features = ["blocking"], optional = true }
dpi = { version = "0.1", optional = true }
euclid = { version = "0.22", optional = true }
rustls = { version = "0.23", features = ["aws-lc-rs"], optional = true }
log = "0.4"
env_logger = "0.11"
# Accounts from cce-secrets: the same Secret Service store cce-secrets
# fronts (gnome-keyring here), read over D-Bus. The *blocking* API on a
# worker thread, deliberately — an unlock prompt can block for as long as it
# takes and must never be on the frame path — so no async runtime is pulled
# into the browser: async-io, not tokio.
secret-service = { version = "5", features = ["rt-async-io-crypto-rust"] }
# The account watcher's page messages are JSON, and cce-ui parses config
# through serde_json already — this only names the parser directly.
serde_json = "1"
# Naming a Secret Service object path (the handle a picked account's secret is
# fetched by). Already in the tree under secret-service; this only names it.
zbus = "5"
# Only used by the `wpe` backend, to hold GLib's changing pollfd set in one
# epoll fd that calloop can watch. Optional so a default build skips it.
rustix = { version = "0.38", features = ["event"], optional = true }

[build-dependencies]
bindgen = "0.72"
pkg-config = "0.3"

# The desktop entry's Exec target: a forwarder that links (almost) nothing,
# so the click-to-tab path skips the ~20ms of library loading the full
# binary pays before main(). Explicit [[bin]] only for the name — src/bin/
# autodiscovery would call it `open`. ccebuild installs it automatically
# via cargo metadata; no Makefile involvement.
[[bin]]
name = "cce-browser-open"
path = "src/bin/open.rs"

# The WPE examples need the generated bindings, so they only build with
# the feature — otherwise `cargo test` would try them on a default build.

[[example]]
name = "wpe_spike"
required-features = ["wpe"]

[[example]]
name = "wpe_host"
required-features = ["wpe"]

[[example]]
name = "wpe_input"
required-features = ["wpe"]

[[example]]
name = "wpe_loop"
required-features = ["wpe"]

[[example]]
name = "wpe_tabs"
required-features = ["wpe"]

[[example]]
name = "wpe_dark"
required-features = ["wpe"]

[[example]]
name = "wpe_paste"
required-features = ["wpe"]

[[example]]
name = "wpe_ctx"
required-features = ["wpe"]
