[package]
name = "cce-browser"
version = "0.1.0"
edition = "2021"
# Only runs bindgen when the `wpe` feature is on, so a default build needs
# no WPE headers and stays exactly as it was.
build = "build.rs"

[features]
# The in-progress WPE WebKit port (see WPE-PORT.md). Off by default: the
# shipping browser is still Servo. Needs `pacman -S wpewebkit`.
wpe = ["dep:rustix"]

[dependencies]
cce-ui = { path = "../cce-ui" }
calloop = "0.13.0"
wayland-client = { version = "0.31", features = ["system"] }
servo = "0.4"
url = "2"
http = "1"
reqwest = { version = "0.12", features = ["blocking"] }
dpi = "0.1"
euclid = "0.22"
rustls = { version = "0.23", features = ["aws-lc-rs"] }
log = "0.4"
env_logger = "0.11"
# Only used by the `wpe` backend, to hold GLib's changing pollfd set in one
# epoll fd that calloop can watch. Optional so a default build skips it.
rustix = { version = "0.38", features = ["event"], optional = true }

[build-dependencies]
bindgen = "0.72"
pkg-config = "0.3"

# The WPE examples need the generated bindings, so they only build with
# the feature — otherwise `cargo test` would try them on a default build.

[[example]]
name = "wpe_spike"
required-features = ["wpe"]

[[example]]
name = "wpe_host"
required-features = ["wpe"]

[[example]]
name = "wpe_input"
required-features = ["wpe"]

[[example]]
name = "wpe_loop"
required-features = ["wpe"]

[[example]]
name = "wpe_tabs"
required-features = ["wpe"]

[[example]]
name = "wpe_dark"
required-features = ["wpe"]
