[package]
name = "cce-browser"
version = "0.1.0"
edition = "2021"
# Only runs bindgen when the `wpe` feature is on, so a default build needs
# no WPE headers and stays exactly as it was.
build = "build.rs"

[features]
# WPE WebKit is the engine as of 2026-08-30 (see WPE-PORT.md). Default, so a
# plain `cargo build` — including another session's sweep or reinstall —
# ships the right engine instead of silently reverting to Servo, which is
# exactly what happened two days after the port landed. Needs
# `pacman -S wpewebkit`.
default = ["wpe"]
wpe = ["dep:rustix"]
# The retired Servo backend, kept buildable for comparison:
#   cargo build --release -p cce-browser --no-default-features --features servo
servo = ["dep:servo", "dep:dpi", "dep:euclid", "dep:rustls", "dep:reqwest", "dep:http"]

[dependencies]
cce-ui = { path = "../cce-ui" }
calloop = "0.13.0"
wayland-client = { version = "0.31", features = ["system"] }
servo = { version = "0.4", optional = true }
url = "2"
http = { version = "1", optional = true }
reqwest = { version = "0.12", features = ["blocking"], optional = true }
dpi = { version = "0.1", optional = true }
euclid = { version = "0.22", optional = true }
rustls = { version = "0.23", features = ["aws-lc-rs"], optional = true }
log = "0.4"
env_logger = "0.11"
# Only used by the `wpe` backend, to hold GLib's changing pollfd set in one
# epoll fd that calloop can watch. Optional so a default build skips it.
rustix = { version = "0.38", features = ["event"], optional = true }

[build-dependencies]
bindgen = "0.72"
pkg-config = "0.3"

# The WPE examples need the generated bindings, so they only build with
# the feature — otherwise `cargo test` would try them on a default build.

[[example]]
name = "wpe_spike"
required-features = ["wpe"]

[[example]]
name = "wpe_host"
required-features = ["wpe"]

[[example]]
name = "wpe_input"
required-features = ["wpe"]

[[example]]
name = "wpe_loop"
required-features = ["wpe"]

[[example]]
name = "wpe_tabs"
required-features = ["wpe"]

[[example]]
name = "wpe_dark"
required-features = ["wpe"]

[[example]]
name = "wpe_paste"
required-features = ["wpe"]

[[example]]
name = "wpe_ctx"
required-features = ["wpe"]
